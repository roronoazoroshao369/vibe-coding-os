name: Quality Scorecard Session

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  scorecard-session:
    if: github.event.label.name == 'quality-scorecard'
    name: Quality scorecard session
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for quality scorecard data
        id: check-data
        shell: bash
        run: |
          SCORECARD_DIRS="docs/reports docs/metrics templates"
          found=false
          for dir in $SCORECARD_DIRS; do
            if [ -d "$dir" ] && find "$dir" -maxdepth 2 -name "*.md" -print -quit | grep -q .; then
              found=true
              echo "Found scorecard data in $dir"
            fi
          done
          if [ "$found" = "true" ]; then
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_data=false" >> "$GITHUB_OUTPUT"
            echo "No quality scorecard data found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run scorecard report
        id: scorecard
        if: steps.check-data.outputs.has_data == 'true'
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p scorecard-session
          set +e
          node scripts/quality-scorecard-report.mjs 2>&1 | tee scorecard-session/scorecard-report.log
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 0 ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Generate scorecard session summary
        id: generate-summary
        if: steps.check-data.outputs.has_data == 'true'
        shell: bash
        run: |
          mkdir -p scorecard-session
          {
            echo "# Quality Scorecard Session"
            echo
            echo "Triggered by: Issue #${{ github.event.issue.number }} — ${{ github.event.issue.title }}"
            echo "Run: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "## Summary"
            echo
            if [ -f scorecard-session/scorecard-report.log ]; then
              echo '```'
              cat scorecard-session/scorecard-report.log
              echo '```'
            else
              echo "_No scorecard output captured._"
            fi
            echo
            echo "## Historical scorecard runs"
            echo
            echo "| Source | Count |"
            echo "| --- | --- |"
            echo "| docs/reports | $(find docs/reports -maxdepth 2 -name '*.md' 2>/dev/null | wc -l) |"
            echo "| docs/metrics | $(find docs/metrics -maxdepth 2 -name '*.md' 2>/dev/null | wc -l) |"
            echo "| templates | $(find templates -maxdepth 2 -name 'scorecard*' -o -name 'metrics*' 2>/dev/null | wc -l) |"
            echo
            echo "## Next steps"
            echo
            echo "- Review the scorecard log above for trends and warnings."
            echo "- Update the associated issue with any findings."
            echo "- Record lessons learned in templates/lesson-entry-template.md if applicable."
          } > scorecard-session/scorecard-summary.md
          cat scorecard-session/scorecard-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Archive scorecard session artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-session-${{ github.event.issue.number }}
          path: scorecard-session/
          if-no-files-found: warn
          retention-days: 30

      - name: Comment on the issue
        if: steps.check-data.outputs.has_data == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- quality-scorecard-session -->';
            const summaryPath = 'scorecard-session/scorecard-summary.md';
            let body;
            if (fs.existsSync(summaryPath)) {
              const summary = fs.readFileSync(summaryPath, 'utf8');
              body = `${marker}\n${summary}`;
            } else {
              body = `${marker}\n## Quality Scorecard Session\n\nScorecard session completed. Download the \`scorecard-session-${{ github.event.issue.number }}\` artifact for full details.`;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
