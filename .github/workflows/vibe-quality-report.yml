name: Vibe Weekly Quality Report

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  weekly-quality-report:
    name: Weekly quality report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for telemetry data
        id: telemetry
        shell: bash
        run: |
          if [ -d docs/metrics ] && find docs/metrics -type f ! -name '.gitkeep' -print -quit | grep -q .; then
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          elif [ -f templates/session-metrics-aggregate.json ]; then
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_data=false" >> "$GITHUB_OUTPUT"
            echo "No new telemetry data found; skipping weekly quality report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run session metrics
        if: steps.telemetry.outputs.has_data == 'true'
        shell: bash
        run: |
          mkdir -p quality-weekly-report
          npm run quality:session-metrics -- --output=quality-weekly-report/session-metrics.md 2>&1 | tee quality-weekly-report/session-metrics.log

      - name: Run trend report
        if: steps.telemetry.outputs.has_data == 'true'
        shell: bash
        run: |
          npm run quality:trend-report -- --output=quality-weekly-report/trend-report.md 2>&1 | tee quality-weekly-report/trend-report.log
          if [ ! -f quality-weekly-report/trend-report.md ]; then
            cp quality-weekly-report/trend-report.log quality-weekly-report/trend-report.md
          fi

      - name: Create GitHub issue
        if: steps.telemetry.outputs.has_data == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().slice(0, 10);
            const trendPath = 'quality-weekly-report/trend-report.md';
            const metricsPath = 'quality-weekly-report/session-metrics.md';
            const trend = fs.existsSync(trendPath) ? fs.readFileSync(trendPath, 'utf8') : '_No trend report content generated._';
            const metrics = fs.existsSync(metricsPath) ? fs.readFileSync(metricsPath, 'utf8') : '_No session metrics content generated._';
            const body = [
              '## Weekly Vibe Quality Report',
              '',
              `Generated: ${date}`,
              '',
              '### Trend report',
              trend.slice(0, 30000),
              '',
              '### Session metrics',
              metrics.slice(0, 20000)
            ].join('\n');
            await github.rest.issues.create({
              ...context.repo,
              title: `Weekly Vibe Quality Report - ${date}`,
              labels: ['quality', 'report'],
              body
            });
