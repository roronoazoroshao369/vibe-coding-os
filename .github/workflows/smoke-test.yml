name: Adapter Smoke Tests

on:
  push:
    branches: [main]
    paths:
      - 'adapters/**'
      - 'scripts/smoke-test-adapters.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'adapters/**'
      - 'scripts/smoke-test-adapters.mjs'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/smoke-test-adapters.mjs
